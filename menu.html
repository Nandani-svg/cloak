<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="popup-wrapper">


<div class="ghost-layer" aria-hidden="true">

<ellipse cx="50" cy="34"
rx="4" ry="6"

opacity="0.9"/>

stroke="var(--bg-crypt)"

<circle cx="38" cy="28" r="3.5"
fill="var(--bg-crypt)"
opacity="0.9"/>
</svg>

</div>


<header class="header">
<div class="brand">
<img src="images/logo.png"
alt="Cloak"
class="brand-logo">
<h1 class="brand-name">Cloak</h1>
</div>
<button id="btnReload"
class="header-action"
title="Reload active tab">
<svg width="14" height="14"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2.2"
stroke-linecap="round"
stroke-linejoin="round">
<path d="M21.5 2v6h-6
M2.5 22v-6h6
M2 11.5a10 10 0 0 1 18.8-4.3
M22 12.5a10 10 0 0 1-18.8 4.2"/>
</svg>
<span>Reload</span>
</button>
</header>


<div class="site-header">
<div class="site-icon-wrapper"
id="siteFavicon">
<svg width="15" height="15"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">
<circle cx="12" cy="12" r="10">
</circle>
<line x1="2" y1="12"
x2="22" y2="12">
</line>
<path d="M12 2
a15.3 15.3 0 0 1 4 10
15.3 15.3 0 0 1-4 10
15.3 15.3 0 0 1-4 10
15.3 15.3 0 0 1 4-10z">
</path>
</svg>
</div>
<div class="site-meta">
<div class="site-title-row">
<span id="site-host"
    class="site-host">
Loading.... 
</span>
<span id="sslBadge"
class="ssl-badge">
Secure
</span>
</div>
<span id="siteURL"
class="site-origin">
Permission for this origin
</span>
</div>
</div>


<div id="systemNotice"
class="system-notice"
style="display: none;">
<span>
Chrome settings cannot be changed
on internal browser pages.
</span>
</div>


<div class="permission-list"
id="permissionList">


<label class="perm-row"
for="cookies">
<div class="perm-icon">
<img src="images/cookie.png"
alt="Cookies">
</div>
<div class="perm-info">
<span class="perm-title">
Cookies
</span>
<span class="perm-desc">
Store data and preferences
on this device
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="cookies"
class="setting">
<span class="switch"></span>
</div>
</label>


<label class="perm-row"
for="javascript">
<div class="perm-icon">
<img src="images/scripts.png"
alt="JavaScript">
</div>
<div class="perm-info">
<span class="perm-title">
JavaScript
</span>
<span class="perm-desc">
Run interactive scripts
and page logic
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="javascript"
class="setting">
<span class="switch"></span>
</div>
</label>


<label class="perm-row"
for="popups">
<div class="perm-icon">
<img src="images/popup.png"
alt="Pop-ups">
</div>
<div class="perm-info">
<span class="perm-title">
Pop-ups &amp; Redirects
</span>
<span class="perm-desc">
Open additional windows
and overlays
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="popups"
class="setting">
<span class="switch"></span>
</div>
</label>


<label class="perm-row"
for="camera">
<div class="perm-icon">
<img src="images/camera.png"
alt="Camera">
</div>
<div class="perm-info">
<span class="perm-title">
Camera
</span>
<span class="perm-desc">
Access connected cameras
and webcams
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="camera"
class="setting">
<span class="switch"></span>
</div>
</label>


<label class="perm-row"
for="microphone">
<div class="perm-icon">
<img src="images/microphone.png"
alt="Microphone">
</div>
<div class="perm-info">
<span class="perm-title">
Microphone
</span>
<span class="perm-desc">
Capture and record audio
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="microphone"
class="setting">
<span class="switch"></span>
</div>
</label>


<label class="perm-row"
for="clipboard">
<div class="perm-icon">
<img src="images/clipboard.png"
alt="Clipboard">
</div>
<div class="perm-info">
<span class="perm-title">
Clipboard
</span>
<span class="perm-desc">
Read and write copied data 
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="clipboard"
class="setting">
<span class="switch"></span>
</div>
</label>


<label class="perm-row"
for="location">
<div class="perm-icon">
<img src="images/location.png"
alt="Location">
</div>
<div class="perm-info">
<span class="perm-title">
Location
</span>
<span class="perm-desc">
Access physical GPS
coordinates
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="location"
class="setting">
<span class="switch"></span>
</div>
</label>


<label class="perm-row"
for="notifications">
<div class="perm-icon">
<img src="images/notification.png"
alt="Notifications">
</div>
<div class="perm-info">
<span class="perm-title">
Notifications
</span>
<span class="perm-desc">
Display desktop alerts
and notifications
</span>
</div>
<div class="toggle">
<input type="checkbox"
id="notifications"
class="setting">
<span class="switch"></span>
</div>
</label>

</div>


<footer class="footer">
<span class="footer-hint">
Settings are saved per site
</span>
<button id="btnClearSiteData"
class="footer-link">
Clear site data
</button>
</footer>
</div>

<script src="menu.js"></script>
</body>
</html>
